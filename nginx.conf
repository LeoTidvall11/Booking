events { worker_connections 500; }

http {
    upstream booking_servers {
        # En misslyckad request räcker för att hoppa över instansen i 10 sekunder
        server booking-api-1:8080 max_fails=1 fail_timeout=10s;
        server booking-api-2:8080 max_fails=1 fail_timeout=10s;
        server booking-api-3:8080 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://booking_servers;

            # Ge snabbt upp om en instans inte svarar och prova nästa
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
