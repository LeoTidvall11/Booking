services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-booking
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  booking-api-1:
    build: .
    container_name: booking-app-1

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      INSTANCE_NAME: "api-1"
    depends_on:
      - postgres-db


  booking-api-2:
    build: .
    container_name: booking-app-2

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      INSTANCE_NAME: "api-2"
    depends_on:
      - postgres-db

  booking-api-3:
    build: .
    container_name: booking-app-2

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      INSTANCE_NAME: "api-3"
    depends_on:
      - postgres-db

  nginx:
    image: nginx:alpine
    container_name: nginx-booking
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - booking-api-1
      - booking-api-2
      - booking-api-3


volumes:
  postgres_data: