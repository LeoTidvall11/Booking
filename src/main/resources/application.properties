spring.application.name=Booking

instance.name=${INSTANCE_NAME:api-default}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bookingdb}
spring.datasource.username=${POSTGRES_USER:booking_admin}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true